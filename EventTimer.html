<!doctype html>
<html lang="en">
<title>Event Countdown</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  /* One-screen stage: clock / title / timer / next, controls float top-right and fade when idle */
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #888;
    --accent: #ff3b30;
    --panel: #111;
    --line: #333;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body {
    height: 100%; margin: 0; overflow: hidden;
    background: var(--bg); color: var(--fg); font-family: var(--font);
    -webkit-tap-highlight-color: transparent;
  }
  .wrap {
    display: grid; grid-template-rows: auto 1fr auto auto;
    height: 100%; place-items: center; text-align: center; gap: 16px;
    padding-block: 64px 24px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #clock { font-weight: 700; font-size: clamp(24px, 4vw, 48px); color: var(--accent); letter-spacing: 0.04em; }
  #title { font-weight: 800; font-size: clamp(28px, 6vw, 72px); text-wrap: balance; align-self: end; max-width: 100%; }
  #timer { font-weight: 900; font-size: clamp(64px, 20vw, 320px); line-height: 1; }
  #next  { font-size: clamp(16px, 2.5vw, 36px); color: var(--muted); }
  #timer, #clock { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

  .controls {
    position: fixed;
    top: calc(8px + env(safe-area-inset-top, 0px));
    right: calc(8px + env(safe-area-inset-right, 0px));
    left: calc(8px + env(safe-area-inset-left, 0px));
    display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end;
    transition: opacity .4s; z-index: 5;
  }
  body.idle .controls { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  button {
    background: var(--panel); border: 1px solid var(--line);
    padding: 8px 10px; border-radius: 8px; color: var(--fg);
    cursor: pointer; font: 600 0.85rem var(--font); user-select: none; -webkit-user-select: none;
  }
  button:hover { border-color: #555; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.on { border-color: var(--accent); color: var(--accent); }
  .dropzone { border: 2px dashed var(--line); border-radius: 16px; padding: 6px 10px; color: #bbb; font-size: 0.8rem; align-self: center; }
  @media (hover: none) { .dropzone { display: none; } }

  #toast {
    position: fixed; left: 50%; top: calc(56px + env(safe-area-inset-top, 0px));
    transform: translateX(-50%); background: var(--panel); border: 1px solid var(--line);
    padding: 10px 14px; border-radius: 10px; font-size: 0.9rem; max-width: calc(100% - 32px);
    text-align: center; z-index: 20;
  }

  /* schedule editor */
  #editor {
    position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 30;
    display: grid; place-items: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px;
  }
  .sheet {
    width: min(640px, 100%); max-height: 100%; display: grid; gap: 10px;
    grid-template-rows: auto auto 1fr auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px;
  }
  .sheet h2 { margin: 0; font-size: 1.1rem; }
  .sheet p { margin: 0; color: var(--muted); font-size: 0.85rem; line-height: 1.4; }
  #csvText {
    width: 100%; min-height: 40vh; resize: vertical; background: var(--bg); color: var(--fg);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px;
    font: 14px/1.5 ui-monospace, Menlo, monospace;
  }
  .row { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  #editErr { color: var(--accent); font-size: 0.85rem; }

  /* mini timer canvas/video used for Picture-in-Picture (kept off-screen but rendered) */
  #pipVideo, #pipCanvas { position: fixed; width: 2px; height: 2px; opacity: 0.01; left: 0; bottom: 0; pointer-events: none; }
  @media (prefers-reduced-motion: reduce) { .controls { transition: none; } }
</style>

<div class="wrap">
  <div id="clock">--:--:--</div>
  <div id="title">No event loaded</div>
  <div id="timer">--:--</div>
  <div id="next"></div>
</div>

<div class="controls" id="controls">
  <button id="skipBtn" type="button" class="on" title="End this turn now and start the next one; later events move earlier (n or →)">Next ▸</button>
  <button id="undoBtn" type="button" title="Undo the last skip (u)" hidden>Undo</button>
  <button id="miniBtn" type="button" title="Floating mini timer that stays above other windows (m)">Mini window</button>
  <button id="editBtn" type="button">Edit schedule</button>
  <button id="loadBtn" type="button">Load CSV</button>
  <input id="csvInput" type="file" accept=".csv,text/csv,text/plain" hidden>
  <button id="fsBtn" type="button" title="Toggle fullscreen (f)">Fullscreen</button>
  <button id="soundBtn" type="button">Enable sound</button>
  <div class="dropzone" id="drop">or drop CSV here</div>
</div>

<div id="toast" hidden></div>

<div id="editor" hidden>
  <form class="sheet" id="editForm">
    <h2>Schedule</h2>
    <p>One line per event: <code>event_name,hours,minutes</code> in 24h, for today. Each event ends when the next one starts.</p>
    <textarea id="csvText" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    <div>
      <div id="editErr"></div>
      <div class="row">
        <button type="button" id="resetBtn">Restore default</button>
        <button type="button" id="cancelBtn">Cancel</button>
        <button type="submit" id="saveBtn" class="on">Save</button>
      </div>
    </div>
  </form>
</div>

<canvas id="pipCanvas" width="640" height="360"></canvas>
<video id="pipVideo" muted playsinline autoplay></video>

const $ = id => document.getElementById(id);
const clockEl = $('clock'), titleEl = $('title'), timerEl = $('timer'), nextEl = $('next');
const toastEl = $('toast');
let events = [];
let lastFiredBoundary = null;
let soundReady = false;
let state = { clock: '--:--:--', title: '', timer: '--:--', next: '' };

/* ---------- storage (optional convenience) ---------- */
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} }
};

function toast(msg, ms = 3500) {
  toastEl.textContent = msg; toastEl.hidden = false;
  clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.hidden = true, ms);
}

/* ---------- CSV + schedule ---------- */
function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) throw new Error('Add a header line and at least one event.');
  const header = lines[0].split(',').map(s => s.trim().toLowerCase());
  const iN = header.indexOf('event_name'), iH = header.indexOf('hours'), iM = header.indexOf('minutes');
  if (iN < 0 || iH < 0 || iM < 0) throw new Error('The first line must be: event_name,hours,minutes');
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',').map(s => s.trim());
    // allow commas in names: name is everything except the last two numeric columns when header is standard
    let name = cols[iN];
    if (iN === 0 && iH === 1 && iM === 2 && cols.length > 3) name = cols.slice(0, cols.length - 2).join(',');
    const h = parseInt(cols[cols.length > 3 ? cols.length - 2 : iH], 10);
    const m = parseInt(cols[cols.length > 3 ? cols.length - 1 : iM], 10);
    if (!name || Number.isNaN(h) || Number.isNaN(m)) continue;
    rows.push({ name, h, m });
  }
  if (!rows.length) throw new Error('No valid events found.');
  return rows;
}

function buildTodaySchedule(rows) {
  const now = new Date(), y = now.getFullYear(), mo = now.getMonth(), d = now.getDate();
  rows = [...rows].sort((a, b) => a.h - b.h || a.m - b.m);
  const list = rows.map(r => ({ name: r.name, start: new Date(y, mo, d, r.h, r.m, 0, 0) }));
  list.forEach((e, i) => e.end = i + 1 < list.length ? new Date(list[i + 1].start) : new Date(y, mo, d, 23, 59, 0, 0));
  return list;
}

function loadCSVText(text, save = true) {
  const rows = parseCSV(text);
  events = buildTodaySchedule(rows);
  events.forEach(e => e.base = e.start.getTime());
  lastFiredBoundary = null;
  undoStack = [];
  if (save) { store.set('timer.csv.v2', text); store.del('timer.shift'); }
  updateUndo();
  tick();
}

/* ---------- skipping ahead when a turn finishes early ---------- */
let undoStack = [];
const snapshot = () => events.map(e => [e.start.getTime(), e.end.getTime()]);
function restore(snap) { snap.forEach(([s, en], i) => { events[i].start = new Date(s); events[i].end = new Date(en); }); }
function updateUndo() { $('undoBtn').hidden = !undoStack.length; }
function saveShift() {
  if (!undoStack.length) { store.del('timer.shift'); return; }
  store.set('timer.shift', JSON.stringify({ day: new Date().toDateString(), csv: currentCSV(), snap: snapshot(), undo: undoStack }));
}
function restoreShift() {
  try {
    const s = JSON.parse(store.get('timer.shift') || 'null');
    if (!s || s.day !== new Date().toDateString() || s.csv !== currentCSV() || s.snap.length !== events.length) return;
    restore(s.snap); undoStack = s.undo || []; updateUndo();
  } catch {}
}

function skipToNext() {
  const now = new Date();
  const active = findActive(now, events);
  // the boundary we jump to: end of the running turn, or the start of the event we're waiting for
  const target = active ? active.end : (nextAfter(now, events) || {}).start;
  if (!target || !nextAfter(active ? active.start : new Date(now - 1), events)) { toast('There is no next event to move to.'); return; }
  const delta = target - now;
  if (delta <= 0) return;
  undoStack.push(snapshot());
  const boundary = target.getTime();
  for (const e of events) {
    if (e.start.getTime() >= boundary) { e.start = new Date(e.start - delta); e.end = new Date(e.end - delta); }
  }
  if (active) active.end = new Date(now);
  // the last event always ends at 23:59, don't pull that earlier
  const last = events[events.length - 1];
  last.end = new Date(last.end.getFullYear(), last.end.getMonth(), last.end.getDate(), 23, 59, 0, 0);
  lastFiredBoundary = null;
  if (soundReady) playBell();
  updateUndo(); saveShift(); tick();
  toast(`Moved on. The rest of the schedule is ${formatShift(delta)} earlier.`);
}
function undoSkip() {
  const snap = undoStack.pop(); if (!snap) return;
  restore(snap); lastFiredBoundary = null;
  updateUndo(); saveShift(); tick();
  toast('Skip undone.');
}
function formatShift(ms) {
  const total = Math.round(ms / 1000), m = Math.floor(total / 60), s = total % 60;
  return m ? (s ? `${m} min ${s} s` : `${m} min`) : `${s} s`;
}
function aheadNote(now) {
  const up = events.find(e => e.start > now);
  if (!up || up.base == null) return '';
  const diff = up.base - up.start.getTime();
  return diff >= 60000 ? ` · ${Math.floor(diff / 60000)} min ahead` : '';
}

/* ---------- formatting ---------- */
const pad = n => String(n).padStart(2, '0');
const formatClock = d => `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
function formatMMSS(ms) {
  const t = Math.max(0, Math.floor(ms / 1000));
  if (t >= 3600) return `${Math.floor(t / 3600)}:${pad(Math.floor(t % 3600 / 60))}:${pad(t % 60)}`;
  return `${pad(Math.floor(t / 60))}:${pad(t % 60)}`;
}
const findActive = (now, ev) => ev.find(e => e.start <= now && now < e.end) || null;
const nextAfter = (t, ev) => ev.find(e => e.start > t) || null;

/* ---------- sound (Web Audio for iPad reliability, <audio> fallback) ---------- */
let audioCtx = null, bellBuffer = null, bellEl = null;
function b64ToBytes(b64) { const s = atob(b64); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
async function enableSound() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    await audioCtx.resume();
    const bytes = b64ToBytes(BELL_B64).buffer;
    bellBuffer = await new Promise((res, rej) => audioCtx.decodeAudioData(bytes, res, rej));
    // silent blip to fully unlock iOS
    const g = audioCtx.createGain(); g.gain.value = 0; const o = audioCtx.createOscillator(); o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime + 0.05);
  } catch {
    bellEl = new Audio('data:audio/wav;base64,' + BELL_B64);
    try { await bellEl.play(); bellEl.pause(); bellEl.currentTime = 0; } catch {}
  }
  soundReady = true;
  $('soundBtn').textContent = 'Test bell';
  $('soundBtn').classList.add('on');
}
function playBell() {
  if (bellBuffer && audioCtx) {
    if (audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
    const src = audioCtx.createBufferSource(); src.buffer = bellBuffer; src.connect(audioCtx.destination); src.start();
  } else if (bellEl) { bellEl.currentTime = 0; bellEl.play().catch(() => {}); }
}
function maybePlayBell(label) {
  if (!soundReady || lastFiredBoundary === label) return;
  lastFiredBoundary = label; playBell();
}

/* ---------- main tick ---------- */
function tick() {
  const now = new Date();
  if (events.length && events[0].start.toDateString() !== now.toDateString()) {
    events = buildTodaySchedule(events.map(e => ({ name: e.name, h: e.start.getHours(), m: e.start.getMinutes() })));
    lastFiredBoundary = null;
  }
  state.clock = formatClock(now);
  if (!events.length) {
    Object.assign(state, { title: 'No events loaded', timer: '--:--', next: '' });
  } else {
    const active = findActive(now, events);
    if (active) {
      const remaining = active.end - now;
      const nxt = nextAfter(active.start, events);
      Object.assign(state, { title: active.name, timer: formatMMSS(remaining), next: nxt ? `Next Event: ${nxt.name}${aheadNote(now)}` : 'No upcoming events.' });
      if (remaining <= 1000 && remaining > 0) maybePlayBell(`end:${active.name}:${active.end.toISOString()}`);
    } else {
      const nxt = nextAfter(now, events);
      if (nxt) {
        const after = nextAfter(nxt.start, events);
        Object.assign(state, { title: `Waiting for: ${nxt.name}`, timer: formatMMSS(nxt.start - now), next: after ? `Next Event: ${after.name}` : 'No upcoming events.' });
        if (nxt.start - now <= 1000 && nxt.start - now > 0) maybePlayBell(`start:${nxt.name}:${nxt.start.toISOString()}`);
      } else {
        Object.assign(state, { title: 'Event has passed.', timer: '', next: '' });
      }
    }
  }
  if (clockEl.textContent !== state.clock) clockEl.textContent = state.clock;
  if (titleEl.textContent !== state.title) titleEl.textContent = state.title;
  if (timerEl.textContent !== state.timer) timerEl.textContent = state.timer;
  if (nextEl.textContent !== state.next) nextEl.textContent = state.next;
  renderPip();
}
// setInterval keeps running (throttled) when the tab is in the background, unlike requestAnimationFrame
setInterval(tick, 200);

/* ---------- Mini window: Document PiP (Chrome/Edge desktop) or video PiP (Safari, iPad) ---------- */
const canvas = $('pipCanvas'), ctx = canvas.getContext('2d'), video = $('pipVideo');
let docPipWin = null, videoPipOn = false, streamStarted = false;

function ensureStream() {
  if (streamStarted || !canvas.captureStream) return;
  streamStarted = true;
  drawCanvas();
  video.srcObject = canvas.captureStream(10);
  video.play().catch(() => {});
}

function fitText(text, maxW, startPx, weight) {
  let px = startPx;
  do { ctx.font = `${weight} ${px}px ${getComputedStyle(document.body).fontFamily}`; px -= 2; } while (ctx.measureText(text).width > maxW && px > 10);
}
function drawCanvas() {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ff3b30'; fitText(state.clock, W - 40, 34, 700); ctx.fillText(state.clock, W / 2, 36);
  ctx.fillStyle = '#fff'; fitText(state.title, W - 40, 40, 800); ctx.fillText(state.title, W / 2, 104);
  fitText(state.timer || '—', W - 40, 160, 900); ctx.fillText(state.timer || '—', W / 2, 212);
  ctx.fillStyle = '#888'; fitText(state.next, W - 40, 26, 500); ctx.fillText(state.next, W / 2, 326);
}

function renderPip() {
  if (streamStarted) drawCanvas();
  if (docPipWin && !docPipWin.closed) {
    const d = docPipWin.document;
    for (const k of ['clock', 'title', 'timer', 'next']) {
      const el = d.getElementById(k); if (el && el.textContent !== state[k]) { el.textContent = state[k]; if (k === 'timer') fitPipTimer(); }
    }
  }
}

// Scale the big countdown so it always fits inside the mini window, whatever its size or digit count
function fitPipTimer() {
  if (!docPipWin || docPipWin.closed) return;
  const d = docPipWin.document, box = d.getElementById('tbox'), el = d.getElementById('timer');
  if (!box || !el) return;
  const W = box.clientWidth * 0.94, H = box.clientHeight * 0.95;
  el.style.fontSize = '100px';
  const w = el.scrollWidth || 1, h = el.scrollHeight || 1;
  el.style.fontSize = Math.max(10, Math.floor(100 * Math.min(W / w, H / h))) + 'px';
}

async function openDocPip() {
  const w = await window.documentPictureInPicture.requestWindow({ width: 340, height: 200 });
  docPipWin = w;
  const d = w.document;
  d.head.innerHTML = `<meta name="viewport" content="width=device-width"><style>
    html,body{margin:0;height:100%;background:#000;color:#fff;font-family:${getComputedStyle(document.body).fontFamily};overflow:hidden}
    .w{height:100%;display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 10px;box-sizing:border-box;gap:2px}
    .w>div{max-width:100%;flex:none}
    #clock{color:#ff3b30;font-weight:700;font-size:min(6vw,11vh);font-variant-numeric:tabular-nums;line-height:1.15}
    #title{font-weight:800;font-size:min(6vw,11vh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
    .w>#tbox{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
    #timer{font-weight:900;line-height:1;white-space:nowrap;font-variant-numeric:tabular-nums}
    #next{color:#888;font-size:min(4.5vw,9vh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
  </style>`;
  d.body.innerHTML = '<div class="w"><div id="clock"></div><div id="title"></div><div id="tbox"><span id="timer"></span></div><div id="next"></div></div>';
  w.addEventListener('resize', fitPipTimer);
  w.addEventListener('pagehide', () => { docPipWin = null; setMiniBtn(false); });
  setMiniBtn(true); renderPip(); fitPipTimer();
}

async function openVideoPip() {
  ensureStream();
  if (video.readyState < 2) await new Promise(r => { video.onloadeddata = r; setTimeout(r, 800); });
  await video.play().catch(() => {});
  if (document.pictureInPictureEnabled && video.requestPictureInPicture) {
    await video.requestPictureInPicture();
  } else if (video.webkitSupportsPresentationMode && video.webkitSupportsPresentationMode('picture-in-picture')) {
    video.webkitSetPresentationMode('picture-in-picture');
  } else {
    throw new Error('unsupported');
  }
}
video.addEventListener('enterpictureinpicture', () => { videoPipOn = true; setMiniBtn(true); });
video.addEventListener('leavepictureinpicture', () => { videoPipOn = false; setMiniBtn(false); });
video.addEventListener('webkitpresentationmodechanged', () => {
  videoPipOn = video.webkitPresentationMode === 'picture-in-picture'; setMiniBtn(videoPipOn);
});

function setMiniBtn(on) {
  $('miniBtn').classList.toggle('on', on);
  $('miniBtn').textContent = on ? 'Close mini window' : 'Mini window';
}

async function toggleMini() {
  try {
    if (docPipWin && !docPipWin.closed) { docPipWin.close(); docPipWin = null; setMiniBtn(false); return; }
    if (videoPipOn) {
      if (document.pictureInPictureElement) await document.exitPictureInPicture();
      else if (video.webkitSetPresentationMode) video.webkitSetPresentationMode('inline');
      return;
    }
    // Video-style PiP first: it has no address bar. Document PiP (with Chrome's bar) only as a fallback.
    try {
      await openVideoPip();
      toast('Mini window is on. Drag it to any corner; it stays on top of other apps.');
      return;
    } catch (e) {
      if (!('documentPictureInPicture' in window)) throw e;
    }
    await openDocPip();
  } catch {
    toast('This browser can’t open a floating window from here. Try Safari or Chrome, or open the HTML file directly.', 5000);
  }
}
$('miniBtn').addEventListener('click', toggleMini);
ensureStream(); // prepare the stream early so the first tap opens PiP instantly

/* ---------- fullscreen + keep screen awake ---------- */
let wakeLock = null;
async function keepAwake() {
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && soundReady) keepAwake(); });

function toggleFullscreen() {
  const el = document.documentElement;
  const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    if (!fsEl) {
      const req = el.requestFullscreen || el.webkitRequestFullscreen;
      if (!req) throw 0;
      const p = req.call(el); if (p && p.catch) p.catch(() => toast('Fullscreen isn’t available here. On iPad, use Share → Add to Home Screen for a full-screen app.', 5000));
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    }
  } catch { toast('Fullscreen isn’t available here. On iPad, use Share → Add to Home Screen for a full-screen app.', 5000); }
  keepAwake();
}
$('fsBtn').addEventListener('click', toggleFullscreen);

/* ---------- sound button ---------- */
$('soundBtn').addEventListener('click', async () => {
  if (!soundReady) { await enableSound(); keepAwake(); toast('Sound on. The bell rings at every event change.'); }
  else playBell();
});

/* ---------- loading / editing the schedule ---------- */
$('loadBtn').addEventListener('click', () => $('csvInput').click());
$('csvInput').addEventListener('change', async e => {
  const f = e.target.files?.[0]; if (!f) return;
  try { loadCSVText(await f.text()); toast(`Loaded ${events.length} events from ${f.name}`); }
  catch (err) { toast(err.message, 5000); }
  e.target.value = '';
});
const drop = $('drop');
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.style.borderColor = '#666'; }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.style.borderColor = ''; }));
drop.addEventListener('drop', async e => {
  const f = e.dataTransfer?.files?.[0]; if (!f) return;
  try { loadCSVText(await f.text()); toast(`Loaded ${events.length} events from ${f.name}`); }
  catch (err) { toast(err.message, 5000); }
});

const editor = $('editor');
function currentCSV() { return store.get('timer.csv.v2') || DEFAULT_CSV; }
$('editBtn').addEventListener('click', () => { $('csvText').value = currentCSV(); $('editErr').textContent = ''; editor.hidden = false; });
$('cancelBtn').addEventListener('click', () => editor.hidden = true);
$('resetBtn').addEventListener('click', () => { $('csvText').value = DEFAULT_CSV; });
$('editForm').addEventListener('submit', e => {
  e.preventDefault();
  try { loadCSVText($('csvText').value); editor.hidden = true; toast(`Saved ${events.length} events`); }
  catch (err) { $('editErr').textContent = err.message; }
});

/* ---------- keyboard ---------- */
document.addEventListener('keydown', e => {
  if (!editor.hidden || e.target.tagName === 'TEXTAREA') { if (e.key === 'Escape') editor.hidden = true; return; }
  const k = e.key.toLowerCase();
  if (k === 'f') toggleFullscreen();
  if (k === 'm') toggleMini();
  if (k === 'n' || e.key === 'ArrowRight') skipToNext();
  if (k === 'u') undoSkip();
});

/* ---------- auto-hide controls when idle ---------- */
let idleT;
function wake() { document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (editor.hidden) document.body.classList.add('idle'); }, 4000); }
['pointermove', 'pointerdown', 'keydown', 'touchstart'].forEach(t => document.addEventListener(t, wake, { passive: true }));
wake();

/* ---------- start ---------- */
$('skipBtn').addEventListener('click', skipToNext);
$('undoBtn').addEventListener('click', undoSkip);
try {
  navigator.mediaSession.setActionHandler('nexttrack', skipToNext);
  navigator.mediaSession.setActionHandler('previoustrack', undoSkip);
} catch {}

try { loadCSVText(currentCSV(), false); } catch { loadCSVText(DEFAULT_CSV, false); }
restoreShift(); tick();
</script>

</html>
